name: Deploy Storybook to Pages

on:
  push:
    branches: [feat/light-high-contrast]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Work around missing packages/LICENSES (pre-existing repo bug)
        run: mkdir -p packages/LICENSES

      - name: Build @clayui/css (atlas.css with custom properties)
        run: yarn workspace @clayui/css compile

      - name: Build Storybook
        run: yarn storybook:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .storybook-static

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
